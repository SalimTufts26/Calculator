<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./resources/stylesheets/reset.css">
  <link rel="stylesheet" href="./resources/stylesheets/style.css">
  <script src="./resources/scripts/script.js" defer></script>
  <title>Calculator</title>
</head>
<body>
  <div id="container" class="container">
    <div id="top" class="top">
      <h3>Calculator 9000</h3>
      <div id="output" class="output"></div>
    </div>
    <div id="mid" class="mid">
      <div id="numbers" class="numbers"></div>
      <div id="operators" class="operators">
        <button id="add">+</button>
        <button id="subtract">-</button>
        <button id="divide">/</button>
        <button id="multiply">X</button>
        <button id="calc">=</button>
        <button id="clear">CLEAR</button>
      </div>
    </div>
  </div>
  
</body>
</html>
